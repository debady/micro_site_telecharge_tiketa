<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Tiketa - Téléchargement de l'application</title>

  <!-- Style principal -->
  <link rel="stylesheet" href="style.css" />

  <!-- Lottie pour animation -->
  <script src="https://res.cloudinary.com/diwsojrlc/raw/upload/v1762258118/Welcome_fdlhwr.json"></script>
</head>
<body>

  <!-- Conteneur principal -->
  <div class="conteneur">

      <img src="https://res.cloudinary.com/diwsojrlc/image/upload/v1762258046/logo_wde3ue.png" alt="Logo Tiketa" class="logo" />

      <h1 class="titre">Téléchargez l’application Tiketa</h1>
      <p class="description">
        Retrouvez vos événements préférés et achetez vos billets en toute simplicité.
      </p>

      <button id="btnTelecharger" class="bouton">Télécharger l'application</button>

      <div id="animationZone" class="animation"></div>
    </div>
  </div>

  <script src="script.js"></script>

</html>
